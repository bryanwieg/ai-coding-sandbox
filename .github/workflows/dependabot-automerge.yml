name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["Sandbox image"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Merge successful Dependabot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "No pull request associated with the triggering workflow run"
            exit 0
          fi

          author="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json author --jq '.author.login')"
          case "$author" in
            dependabot|dependabot\[bot\]|app/dependabot)
              ;;
            *)
              echo "Refusing to merge PR #$PR_NUMBER from author $author"
              exit 0
              ;;
          esac

          # Another merge landing seconds earlier makes GitHub refuse this
          # one with "Base branch was modified"; retry only that refusal.
          for attempt in 1 2 3 4 5; do
            if out="$(gh pr merge "$PR_NUMBER" \
              --repo "$GH_REPO" \
              --squash \
              --delete-branch 2>&1)"; then
              echo "$out"
              break
            fi
            echo "$out" >&2
            if [[ "$out" != *"Base branch was modified"* || "$attempt" == 5 ]]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # Merges made with GITHUB_TOKEN do not trigger push workflows, so
          # dispatch the release, which rebuilds every image.
          gh workflow run release.yml --repo "$GH_REPO" --ref main

# Every connection goes through the egress proxy. Unknown or changed host
# keys fail instead of prompting: known_hosts is read-only, and
# sandbox-ssh-hostkey prints the line for the user to add. Settings in the
# project's .sandbox/ssh/config come first and can override these.
Host *
    ProxyCommand /usr/bin/nc -X connect -x egress-proxy:3128 %h %p
    StrictHostKeyChecking yes
    UpdateHostKeys no
    ForwardAgent no

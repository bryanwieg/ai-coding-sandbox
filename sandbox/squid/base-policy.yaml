# Base egress policy built into the session proxy image. Every project gets
# these names; a project adds its own in .sandbox/egress-policy.yaml, which
# applies only after it is approved with the trust command.
https:
  - .openai.com
  - .chatgpt.com
  - .oaiusercontent.com
  - .context7.com
  - .anthropic.com
  - .claude.ai
  - .claude.com
  # Claude's user content hosts, such as artifact frames.
  - .claudeusercontent.com
  # Google Cloud Storage, where Claude Code's /plugin reads install counts.
  # The whole service: any bucket's objects are reachable.
  - storage.googleapis.com
  - .github.com
  - .github.io
  - .githubusercontent.com
  - .githubcopilot.com
  # GitHub's LFS object storage. Only this bucket, not all of S3.
  - github-cloud.s3.amazonaws.com
  # Docker Hub, for image pulls by the session Docker daemon.
  - .docker.io
  - .docker.com
  # Additional container registries: GHCR and LSCR.
  - .ghcr.io
  - .lscr.io
  # The VS Code Marketplace, for extensions installed by an attached
  # VS Code window, and its download CDN.
  - marketplace.visualstudio.com
  - .gallery.vsassets.io
  - .gallerycdn.vsassets.io
  - main.vscode-cdn.net
  # GitLab, for Git over HTTPS, its API and its container registry.
  - .gitlab.com
  # PyPI: its index and package files, for pip into a project virtualenv.
  - pypi.org
  - files.pythonhosted.org
  # The Go module proxy and checksum database.
  - proxy.golang.org
  - sum.golang.org
  # Ubuntu's package archive, security updates and keyserver.
  - archive.ubuntu.com
  - security.ubuntu.com
  - keyserver.ubuntu.com
  # Documentation and source code, for reading (WebFetch, curl). Official
  # documentation, reference and standards sites of large projects, where
  # a visitor cannot publish anything or read the access logs. Not included:
  # package registries (they would install code), hosts where anyone can
  # create a subdomain (*.readthedocs.io), and sites that accept anonymous
  # edits (Wikipedia). A project adds others to its own policy.
